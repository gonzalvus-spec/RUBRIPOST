[package]
name = "RubriPost"
version = "0.1.0"
description = "RUBRIFACT API Client"
authors = ["RUBRIFACT"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rubripost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# MongoDB: cliente oficial con pool de conexiones, TLS y resolución DNS (Atlas).
mongodb = "3.9"
bson = { version = "2", features = ["chrono-0_4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
once_cell = "1"
log = "0.4"
env_logger = "0.11"

# Cifrado de secretos en reposo (AES-256-GCM).
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
argon2 = "0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
