<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">RubriPost — API Client</title>
  <desc id="desc">Banner animado de RubriPost: brillo verde, aros en movimiento y trazos de código que se dibujan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d18"/>
      <stop offset="1" stop-color="#103d30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18bb77"/>
      <stop offset="1" stop-color="#0a8f4e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6cf4b6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="banner-clip"><rect width="1200" height="280" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#banner-clip)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <path d="M740 0 L990 0 L790 280 L540 280 Z" fill="#ffffff" opacity=".025"/>
    <path d="M955 0 L1200 0 L1010 280 L765 280 Z" fill="#ffffff" opacity=".025"/>
    <rect x="-400" y="0" width="270" height="280" fill="url(#shine)" transform="skewX(-26)">
      <animate attributeName="x" values="-400;1650" dur="9s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(1066 139)">
      <circle r="100" fill="none" stroke="#21c989" stroke-width="2" stroke-dasharray="16 12" opacity=".27">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle r="72" fill="none" stroke="#c5a059" stroke-width="2" stroke-dasharray="6 13" opacity=".32">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle r="43" fill="#18bb77" opacity=".035">
        <animate attributeName="opacity" values=".035;.13;.035" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" r="5" fill="#e0bb6d">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" repeatCount="indefinite"/>
      <rect x="64" y="71" width="138" height="138" rx="30" fill="url(#accent)"/>
      <rect x="64" y="71" width="138" height="138" rx="30" fill="none" stroke="#92f5c6" stroke-width="2" opacity=".22">
        <animate attributeName="opacity" values=".13;.5;.13" dur="3s" repeatCount="indefinite"/>
      </rect>
      <path d="M117 119 L98 140 L117 161 M150 119 L169 140 L150 161" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="61" stroke-dashoffset="61">
        <animate attributeName="stroke-dashoffset" values="61;0;0" keyTimes="0;.35;1" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M141 111 L127 170" fill="none" stroke="#f1d18a" stroke-width="8" stroke-linecap="round" stroke-dasharray="65" stroke-dashoffset="65">
        <animate attributeName="stroke-dashoffset" values="65;0;0" keyTimes="0;.3;1" dur="5s" begin=".5s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="235" y="130" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="67" font-weight="700" letter-spacing="-2">Rubri<tspan fill="#e0bb6d">Post</tspan></text>
    <text x="239" y="172" fill="#bed8ca" font-family="Arial, Helvetica, sans-serif" font-size="24">Cliente HTTP de escritorio</text>
    <rect x="239" y="192" width="220" height="3" rx="2" fill="#c5a059">
      <animate attributeName="width" values="0;220;220" keyTimes="0;.3;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="239" y="222" fill="#84b6a2" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="1.5">POWERED BY RUBRIFACT</text>
  </g>
</svg>
